name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes (UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FastAPI Backend Health Check
        run: |
          echo "Pinging Render backend..."
          curl -s -f https://pfolio-1hou.onrender.com/health || echo "Ping failed"
